<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT Timestamp Auto-Sync</title>
    <style>
        :root {
            --bg: #121212; --surface: #1e1e1e; --border: #333;
            --text: #e0e0e0; --primary: #3b82f6; --primary-hover: #2563eb;
            --danger: #ef4444; --success: #10b981; --highlight: #374151;
            --selected-ref: #065f46; --selected-tgt: #7f1d1d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column;
        }
        .top-panel {
            background: var(--surface); padding: 15px 20px; border-bottom: 1px solid var(--border);
            display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; z-index: 100;
        }
        .sync-panel {
            background: #111827; padding: 15px 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; z-index: 99;
        }
        .sync-info { display: flex; gap: 30px; font-size: 0.95em; }
        .sync-info div { display: flex; flex-direction: column; gap: 4px; }
        .sync-info span { font-weight: bold; font-family: monospace; font-size: 1.1em; }
        
        .file-input { display: flex; flex-direction: column; gap: 5px; }
        .file-input input { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 5px; border-radius: 4px; }
        
        button {
            background: var(--primary); color: white; border: none;
            padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        button:hover:not(:disabled) { background: var(--primary-hover); }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #exportBtn { background: var(--success); }
        #exportBtn:hover:not(:disabled) { background: #059669; }
        #applyBtn { background: #f59e0b; color: black; padding: 10px 20px; font-size: 1.1em; }
        #applyBtn:hover:not(:disabled) { background: #d97706; }

        .editor-container {
            display: flex; flex: 1; overflow: hidden;
        }
        .col {
            flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border);
        }
        .col-header {
            padding: 10px; background: var(--surface); font-weight: bold; text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .scroll-area { flex: 1; overflow-y: auto; padding: 10px; }
        
        .sub-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
            padding: 10px; margin-bottom: 10px; cursor: pointer; transition: background 0.1s;
        }
        .sub-card:hover { background: var(--highlight); }
        .sub-card.ref-selected { background: var(--selected-ref); border-color: #10b981; }
        .sub-card.tgt-selected { background: var(--selected-tgt); border-color: #ef4444; }
        
        .sub-header { display: flex; justify-content: space-between; color: #aaa; font-size: 0.85em; margin-bottom: 5px; font-family: monospace; }
        .sub-text { line-height: 1.4; white-space: pre-wrap; font-size: 0.95em; }
    </style>
</head>
<body>

<div class="top-panel">
    <div class="file-input">
        <label>1. Reference (Correctly Synced)</label>
        <input type="file" id="refFile" accept=".srt">
    </div>
    <div class="file-input">
        <label>2. Target (Unsynchronized)</label>
        <input type="file" id="targetFile" accept=".srt">
    </div>
    <button id="loadBtn">Load Files</button>
    <button id="exportBtn" disabled>Export Synced SRT</button>
</div>

<div class="sync-panel">
    <div class="sync-info">
        <div>
            <label>Target Time (Reference)</label>
            <span id="lblTargetTime">--:--:--,---</span>
        </div>
        <div>
            <label>Current Time (Unsynchronized)</label>
            <span id="lblCurrentTime">--:--:--,---</span>
        </div>
        <div>
            <label>Calculated Offset</label>
            <span id="lblOffset">0 ms</span>
        </div>
    </div>
    <button id="applyBtn" disabled>Apply Offset to Selected & Below ⬇️</button>
</div>

<div class="editor-container">
    <div class="col">
        <div class="col-header">Reference File (Click to set Target Time)</div>
        <div class="scroll-area" id="refList"></div>
    </div>
    <div class="col">
        <div class="col-header">Unsynchronized File (Click to set Current Time)</div>
        <div class="scroll-area" id="tgtList"></div>
    </div>
</div>

<script>
    let refSubs = [];
    let tgtSubs = [];
    let selRefIdx = -1;
    let selTgtIdx = -1;

    // --- TIME HELPERS ---
    function parseTime(timeStr) {
        if (!timeStr) return 0;
        let clean = timeStr.split('-->')[0].trim().replace('.', ',');
        let [hms, ms] = clean.split(',');
        let [h, m, s] = hms.split(':');
        return (+h * 3600000) + (+m * 60000) + (+s * 1000) + (+ms);
    }

    function formatTime(totalMs) {
        if (totalMs < 0) totalMs = 0;
        let h = Math.floor(totalMs / 3600000);
        let rem = totalMs % 3600000;
        let m = Math.floor(rem / 60000);
        rem = rem % 60000;
        let s = Math.floor(rem / 1000);
        let ms = rem % 1000;
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`;
    }

    // --- SRT PARSER ---
    function parseSRT(data) {
        const blocks = data.replace(/\r\n/g, '\n').trim().split(/\n\s*\n/);
        return blocks.map(block => {
            const lines = block.split('\n');
            if (lines.length < 3) return null;
            const index = lines[0];
            const timeStr = lines[1];
            const text = lines.slice(2).join('\n');
            
            if (!timeStr.includes('-->')) return null;
            const [startStr, endStr] = timeStr.split('-->').map(s => s.trim());
            
            return { 
                index, 
                startMs: parseTime(startStr), 
                endMs: parseTime(endStr), 
                startStr, 
                endStr, 
                text 
            };
        }).filter(b => b !== null);
    }

    // --- UI LOGIC ---
    document.getElementById('loadBtn').addEventListener('click', async () => {
        const refFile = document.getElementById('refFile').files[0];
        const targetFile = document.getElementById('targetFile').files[0];

        if (!refFile || !targetFile) return alert("Select both files.");

        refSubs = parseSRT(await refFile.text());
        tgtSubs = parseSRT(await targetFile.text());

        selRefIdx = -1; selTgtIdx = -1;
        updateSyncPanel();
        renderList('refList', refSubs, 'ref');
        renderList('tgtList', tgtSubs, 'tgt');
        document.getElementById('exportBtn').disabled = false;
    });

    function renderList(containerId, data, type) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        
        data.forEach((sub, i) => {
            const card = document.createElement('div');
            card.className = `sub-card ${type === 'ref' && i === selRefIdx ? 'ref-selected' : ''} ${type === 'tgt' && i === selTgtIdx ? 'tgt-selected' : ''}`;
            card.id = `${type}-card-${i}`;
            
            card.innerHTML = `
                <div class="sub-header">
                    <span>#${sub.index}</span>
                    <span>${sub.startStr} --> ${sub.endStr}</span>
                </div>
                <div class="sub-text">${sub.text}</div>
            `;
            
            card.onclick = () => selectRow(type, i);
            container.appendChild(card);
        });
    }

    function selectRow(type, idx) {
        if (type === 'ref') {
            if (selRefIdx > -1) document.getElementById(`ref-card-${selRefIdx}`).classList.remove('ref-selected');
            selRefIdx = idx;
            document.getElementById(`ref-card-${selRefIdx}`).classList.add('ref-selected');
        } else {
            if (selTgtIdx > -1) document.getElementById(`tgt-card-${selTgtIdx}`).classList.remove('tgt-selected');
            selTgtIdx = idx;
            document.getElementById(`tgt-card-${selTgtIdx}`).classList.add('tgt-selected');
        }
        updateSyncPanel();
    }

    function updateSyncPanel() {
        const lblRef = document.getElementById('lblTargetTime');
        const lblTgt = document.getElementById('lblCurrentTime');
        const lblOffset = document.getElementById('lblOffset');
        const applyBtn = document.getElementById('applyBtn');

        let refTime = '--:--:--,---';
        let tgtTime = '--:--:--,---';
        let offsetMs = 0;

        if (selRefIdx > -1) refTime = refSubs[selRefIdx].startStr;
        if (selTgtIdx > -1) tgtTime = tgtSubs[selTgtIdx].startStr;

        if (selRefIdx > -1 && selTgtIdx > -1) {
            offsetMs = refSubs[selRefIdx].startMs - tgtSubs[selTgtIdx].startMs;
            const sign = offsetMs > 0 ? '+' : '';
            lblOffset.innerText = `${sign}${offsetMs} ms`;
            applyBtn.disabled = false;
        } else {
            lblOffset.innerText = '0 ms';
            applyBtn.disabled = true;
        }

        lblRef.innerText = refTime;
        lblTgt.innerText = tgtTime;
    }

    // --- APPLY OFFSET ---
    document.getElementById('applyBtn').addEventListener('click', () => {
        if (selRefIdx === -1 || selTgtIdx === -1) return;

        const offsetMs = refSubs[selRefIdx].startMs - tgtSubs[selTgtIdx].startMs;

        // Apply offset to selected target subtitle and EVERY subtitle after it
        for (let i = selTgtIdx; i < tgtSubs.length; i++) {
            tgtSubs[i].startMs += offsetMs;
            tgtSubs[i].endMs += offsetMs;
            tgtSubs[i].startStr = formatTime(tgtSubs[i].startMs);
            tgtSubs[i].endStr = formatTime(tgtSubs[i].endMs);
        }

        // Re-render the target list to show new times
        renderList('tgtList', tgtSubs, 'tgt');
        
        // Reset selections to prevent accidental double-clicks
        selRefIdx = -1; selTgtIdx = -1;
        updateSyncPanel();
    });

    // --- EXPORT ---
    document.getElementById('exportBtn').addEventListener('click', () => {
        let output = '';
        tgtSubs.forEach((sub, i) => {
            output += `${i + 1}\n${sub.startStr} --> ${sub.endStr}\n${sub.text}\n\n`;
        });

        const blob = new Blob([output], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'synced_subtitles.srt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
